global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      repeat_interval: 1h

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://elmir:8080/api/alerts'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://elmir:8080/api/alerts'
        send_resolved: true
    # email_configs:           # Aktivieren wenn Email gewünscht
    #   - to: 'deine@email.de'
    #   from: 'siem@alert.de'
    #   smarthost: 'smtp.gmail.com:587'
    #   auth_username: 'deine@gmail.com'
    #   auth_password: 'APP-PASSWORT'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
